<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>챗미나이</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #212121;

    color: white;

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

}


header {

    height: 60px;

    border-bottom:
        1px solid #3a3a3a;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 20px;

}


.logo {

    font-size: 20px;

    font-weight: bold;

}


.new-chat {

    background: transparent;

    color: #cccccc;

    border:
        1px solid #555555;

    border-radius: 8px;

    padding:
        8px 13px;

    cursor: pointer;

}


.new-chat:hover {

    background: #333333;

}


#chat {

    max-width: 850px;

    margin: 0 auto;

    padding:
        25px 20px 130px;

}


.message {

    margin:
        15px 0;

    padding:
        15px 18px;

    border-radius:
        12px;

    line-height:
        1.7;

    white-space:
        pre-wrap;

    overflow-wrap:
        break-word;

}


.user {

    background:
        #343541;

}


.assistant {

    background:
        #292929;

}


.input-area {

    position: fixed;

    bottom: 20px;

    left: 50%;

    transform:
        translateX(-50%);

    width:
        min(
            850px,
            calc(100% - 30px)
        );

    display: flex;

    gap: 10px;

}


#message {

    flex: 1;

    min-width: 0;

    padding:
        15px;

    border:
        1px solid #555555;

    border-radius:
        12px;

    background:
        #303030;

    color: white;

    outline: none;

    font-size: 16px;

}


#send {

    padding:
        0 20px;

    border: none;

    border-radius:
        12px;

    background:
        #10a37f;

    color: white;

    cursor: pointer;

    font-size: 16px;

}


#send:hover {

    background:
        #0d8f70;

}


#send:disabled {

    opacity:
        0.5;

    cursor:
        not-allowed;

}


@media (max-width: 600px) {

    header {

        padding:
            0 15px;

    }


    #chat {

        padding:
            20px 12px 120px;

    }


    .input-area {

        bottom:
            10px;

        width:
            calc(100% - 20px);

    }


    #send {

        padding:
            0 15px;

    }

}

</style>

</head>


<body>


<header>

<div class="logo">
    챗미나이
</div>


<button
    class="new-chat"
    onclick="newChat()">

    새 대화

</button>

</header>



<div id="chat">

<div class="message assistant">

안녕하세요. 챗미나이입니다.
무엇을 도와드릴까요?

</div>

</div>



<div class="input-area">


<input

    id="message"

    type="text"

    placeholder="메시지를 입력하세요..."

    autocomplete="off"


>


<button

    id="send"

    onclick="sendMessage()"

>

전송

</button>


</div>



<script>


const chat =
    document.getElementById("chat");


const input =
    document.getElementById("message");


const send =
    document.getElementById("send");


let history = [];



input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            if (
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }

    }
);



function addMessage(
    text,
    role
) {

    const div =
        document.createElement("div");


    div.className =
        "message " + role;


    div.textContent =
        text;


    chat.appendChild(div);


    window.scrollTo(
        0,
        document.body.scrollHeight
    );


    return div;

}



async function sendMessage() {


    const message =
        input.value.trim();


    if (!message) {

        return;

    }


    addMessage(
        message,
        "user"
    );


    input.value = "";


    send.disabled = true;


    const loading =
        addMessage(
            "생각하는 중...",
            "assistant"
        );


    try {


        const response =
            await fetch(
                "/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            history:
                                history

                        })

                }
            );


        const data =
            await response.json();


        loading.textContent =
            data.answer;


        history.push({

            role:
                "user",

            content:
                message

        });


        history.push({

            role:
                "assistant",

            content:
                data.answer

        });


    }

    catch (error) {


        loading.textContent =
            "서버와 연결할 수 없습니다.";


        console.error(error);

    }


    send.disabled = false;


    input.focus();


}



async function newChat() {


    history = [];


    chat.innerHTML = `

        <div class="message assistant">

        새로운 대화를 시작했습니다.

        </div>

    `;


    input.focus();

}


</script>


</body>

</html>
