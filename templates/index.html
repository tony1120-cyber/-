<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>챗미나이</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #212121;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #333;
            font-size: 22px;
            font-weight: bold;
        }

        .chat {
            max-width: 800px;
            margin: auto;
            padding: 30px 20px 110px;
        }

        .message {
            margin: 20px 0;
            padding: 15px 18px;
            border-radius: 12px;
            line-height: 1.6;
        }

        .user {
            background: #343541;
        }

        .ai {
            background: #2b2b2b;
        }

        .input-area {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: min(800px, calc(100% - 30px));
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #2f2f2f;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 0 20px;
            border: none;
            border-radius: 12px;
            background: #10a37f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d8f70;
        }
    </style>
</head>

<body>

    <div class="header">
        🤖 챗미나이
    </div>

    <div class="chat" id="chat">
        <div class="message ai">
            안녕하세요! 저는 챗미나이입니다. 무엇을 도와드릴까요?
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="챗미나이에게 메시지를 입력하세요..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >

        <button onclick="sendMessage()">전송</button>
    </div>

    <script>
        async function sendMessage() {

            const input = document.getElementById("message");
            const chat = document.getElementById("chat");

            const message = input.value.trim();

            if (!message) return;

            chat.innerHTML += `
                <div class="message user">
                    ${message}
                </div>
            `;

            input.value = "";

            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            });

            const data = await response.json();

            chat.innerHTML += `
                <div class="message ai">
                    ${data.answer}
                </div>
            `;

            window.scrollTo(0, document.body.scrollHeight);
        }
    </script>

</body>
</html>
